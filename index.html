<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Embedding</title>
  </head>
  <body>
    <main>
      <h1>Text embedding</h1>
      <div class="content">
        <section class="embedding-panel">
          <form id="embedding-form">
            <label for="text-input">Enter a word or text</label>
            <input id="text-input" name="text" type="text" required />
            <button id="submit-button" type="submit">Generate vector</button>
          </form>
          <p id="status" role="status"></p>
          <pre id="output"></pre>
        </section>
        <section class="graph-panel" aria-labelledby="graph-title">
          <h2 id="graph-title">Repository similarity graph</h2>
          <p id="graph-summary" role="status"></p>
          <form id="repo-search-form">
            <label for="repo-search">Find a repository</label>
            <input
              id="repo-search"
              name="repository"
              type="search"
              list="repository-options"
              autocomplete="off"
            />
            <datalist id="repository-options"></datalist>
            <button type="submit">Find</button>
            <span id="repo-search-status" role="status"></span>
          </form>
          <div id="graph"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/graph.js"></script>
  </body>
</html>
