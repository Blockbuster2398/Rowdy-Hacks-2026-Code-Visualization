<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repository Similarity Graph</title>
  </head>
  <body>
    <main>
      <h1>Repository similarity graph</h1>
      <div class="content">
        <aside class="settings-panel" aria-labelledby="settings-title">
          <h2 id="settings-title">Graph settings</h2>
          <form id="graph-settings-form">
            <label for="node-limit">
              Repositories to display:
              <output id="node-limit-value" for="node-limit"></output>
            </label>
            <input id="node-limit" name="nodes" type="range" min="1" required />

            <label for="neighbor-limit">Nearest neighbors per repository</label>
            <input id="neighbor-limit" name="neighbors" type="number" min="0" required />

            <label class="checkbox-setting" for="neighborhood-highlighting">
              <input id="neighborhood-highlighting" type="checkbox" checked />
              Highlight hovered node and its neighbors
            </label>

            <button type="submit">Apply settings</button>
          </form>
          <p id="settings-status" role="status"></p>

          <h2>Find a repository</h2>
          <form id="repo-search-form">
            <label for="repo-search">Repository name</label>
            <input
              id="repo-search"
              name="repository"
              type="search"
              list="repository-options"
              autocomplete="off"
            />
            <datalist id="repository-options"></datalist>
            <button type="submit">Find</button>
            <span id="repo-search-status" role="status"></span>
          </form>
          <section id="repository-links-panel" aria-labelledby="repository-links-title" hidden>
            <h3 id="repository-links-title">Linked repositories</h3>
            <ul id="repository-links-list"></ul>
          </section>

          <h2>Add a GitHub repository</h2>
          <p id="unsaved-repositories-notice">
            User-added repositories and custom README entries are temporary. Reloading this page will erase them.
          </p>
          <form id="add-repository-form">
            <label for="repository-url">Public repository URL</label>
            <input
              id="repository-url"
              name="repositoryUrl"
              type="url"
              placeholder="https://github.com/owner/repository"
              required
            />
            <button id="add-repository-button" type="submit">Add repository</button>
            <span id="add-repository-status" role="status"></span>
          </form>

          <h3>Or compare your own README</h3>
          <form id="custom-readme-form">
            <label for="custom-repository-title">Repository title</label>
            <input id="custom-repository-title" name="title" type="text" required />

            <fieldset>
              <legend>README source</legend>
              <label class="radio-setting" for="readme-source-text">
                <input
                  id="readme-source-text"
                  name="readmeSource"
                  type="radio"
                  value="text"
                  checked
                />
                Write README text
              </label>
              <label class="radio-setting" for="readme-source-file">
                <input
                  id="readme-source-file"
                  name="readmeSource"
                  type="radio"
                  value="file"
                />
                Upload a README file
              </label>
            </fieldset>

            <div id="readme-text-source">
              <label for="custom-readme-text">README text</label>
              <textarea id="custom-readme-text" name="readmeText" rows="8" required></textarea>
            </div>
            <div id="readme-file-source" hidden>
              <label for="custom-readme-file">README file</label>
              <input
                id="custom-readme-file"
                name="readmeFile"
                type="file"
                accept=".md,.markdown,.txt,text/markdown,text/plain"
                disabled
              />
            </div>
            <button id="custom-readme-button" type="submit">Compare README</button>
            <span id="custom-readme-status" role="status"></span>
          </form>
        </aside>
        <section class="graph-panel" aria-label="Repository connections graph">
          <div id="graph"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/graph.js"></script>
  </body>
</html>
